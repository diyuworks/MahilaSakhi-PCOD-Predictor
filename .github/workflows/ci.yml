name: MahilaSakhi v3 CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 backend tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest tests -v

  frontend-tests:
    name: Frontend React Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run React Testing Library Tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
